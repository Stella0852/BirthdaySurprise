<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Thomas ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background:
                radial-gradient(circle at top, #3b1838, transparent 50%),
                linear-gradient(135deg, #120b1c, #2b1329, #0d0915);
            color: white;
            overflow: hidden;
        }

        .screen {
            text-align: center;
            padding: 30px;
            width: 100%;
            max-width: 550px;
        }

        .intro {
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 12px;
            color: #d9a9bd;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(44px, 12vw, 75px);
            line-height: 1;
            margin-bottom: 18px;
        }

        .name {
            color: #ffabc7;
            display: block;
            margin-top: 8px;
        }

        .message {
            font-family: Arial, sans-serif;
            color: #d9ccd5;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 45px;
        }

        /* CAKE */

        .cake {
            position: relative;
            width: 190px;
            height: 180px;
            margin: 0 auto 25px;
        }

        .cake-body {
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 180px;
            height: 85px;
            background: linear-gradient(#d97998, #b85e7c);
            border-radius: 12px 12px 20px 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .icing {
            position: absolute;
            top: -8px;
            left: -5px;
            width: 190px;
            height: 35px;
            background: #ffe1eb;
            border-radius: 50%;
        }

        .icing::after {
            content: "";
            position: absolute;
            left: 30px;
            top: 17px;
            width: 15px;
            height: 25px;
            background: #ffe1eb;
            border-radius: 0 0 10px 10px;
            box-shadow:
                55px 0 #ffe1eb,
                110px 0 #ffe1eb;
        }

        /* CANDLE */

        .candle {
            position: absolute;
            z-index: 3;
            left: 88px;
            top: 35px;
            width: 16px;
            height: 60px;
            border-radius: 5px;
            background:
                repeating-linear-gradient(
                    -45deg,
                    #fff,
                    #fff 7px,
                    #f49ab4 7px,
                    #f49ab4 14px
                );
        }

        .wick {
            position: absolute;
            left: 6px;
            top: -7px;
            width: 4px;
            height: 9px;
            background: #29202a;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            z-index: 5;
            left: 86px;
            top: 0;
            width: 20px;
            height: 35px;
            background: #ffd45c;
            border-radius: 50% 50% 45% 45%;
            box-shadow:
                0 0 12px #ffbd32,
                0 0 35px #ff8c00;
            transform-origin: bottom center;
            animation: flicker 0.7s infinite alternate;
            transition: 0.5s ease;
        }

        .flame::after {
            content: "";
            position: absolute;
            left: 5px;
            bottom: 4px;
            width: 10px;
            height: 18px;
            background: #fff5bd;
            border-radius: 50%;
        }

        @keyframes flicker {
            from {
                transform: rotate(-4deg) scale(1);
            }

            to {
                transform: rotate(4deg) scale(1.08);
            }
        }

        /* BUTTON */

        button {
            border: none;
            padding: 15px 27px;
            border-radius: 40px;
            background: #ff8fb1;
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,143,177,0.25);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            background: #ff719d;
        }

        .hint {
            margin-top: 13px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #927c8d;
        }

        /* HIDDEN */

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* SUCCESS MESSAGE */

        #success {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: rgba(15,8,20,0.96);
            opacity: 0;
            pointer-events: none;
            transition: 1s ease;
        }

        #success.show {
            opacity: 1;
            pointer-events: auto;
        }

        #success h2 {
            font-size: clamp(35px, 10vw, 60px);
            margin-bottom: 15px;
            color: #ffb3cb;
        }

        #success p {
            font-family: Arial, sans-serif;
            color: #d9ccd5;
        }

        /* FLOATING HEARTS */

        .heart {
            position: fixed;
            bottom: -30px;
            color: rgba(255, 174, 202, 0.25);
            animation: float 9s linear infinite;
            font-size: 20px;
        }

        .heart:nth-child(1) {
            left: 10%;
        }

        .heart:nth-child(2) {
            left: 75%;
            animation-delay: 3s;
        }

        .heart:nth-child(3) {
            left: 45%;
            animation-delay: 6s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>

    <main class="screen" id="mainScreen">

        <div class="intro">
            A little surprise for you
        </div>

        <h1>
            Happy Birthday
            <span class="name">Thomas ❤️</span>
        </h1>

        <p class="message">
            Before you see what's waiting for you...
            <br>
            close your eyes and make a wish. ✨
        </p>

        <div class="cake">

            <div class="flame" id="flame"></div>

            <div class="candle">
                <div class="wick"></div>
            </div>

            <div class="cake-body">
                <div class="icing"></div>
            </div>

        </div>

        <button onclick="blowCandle()">
            🕯️ Blow out the candle
        </button>

        <p class="hint">
            Make your wish first ❤️
        </p>

    </main>

    <div id="success">

        <div>
            <h2>Wish made. ✨</h2>

            <p>
                And now...
                <br><br>
                there's something waiting for you. ❤️
            </p>
        </div>

    </div>


    <script>

        function blowCandle() {

            const flame = document.getElementById("flame");
            const success = document.getElementById("success");

            // Blow out the flame
            flame.style.opacity = "0";
            flame.style.transform = "scale(0)";

            // Wait for the flame to disappear
            setTimeout(() => {

                success.classList.add("show");

            }, 800);

        }

    </script>

</body>
</html>
