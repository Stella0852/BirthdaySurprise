<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #1a1025, #35152f, #160f22);
            color: white;
            overflow: hidden;
        }

        .screen {
            text-align: center;
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #eab8ca;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 11vw, 70px);
            line-height: 1.05;
            margin-bottom: 15px;
        }

        .name {
            color: #ffb6cf;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #dbcbd5;
            margin-bottom: 45px;
        }

        .cake {
            position: relative;
            width: 180px;
            height: 130px;
            margin: 0 auto 35px;
        }

        .cake-top {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 160px;
            height: 70px;
            background: #d9829b;
            border-radius: 12px 12px 18px 18px;
            box-shadow: inset 0 8px rgba(255,255,255,0.15);
        }

        .icing {
            position: absolute;
            top: 5px;
            left: 0;
            width: 180px;
            height: 30px;
            background: #ffe2eb;
            border-radius: 50%;
        }

        .candle {
            position: absolute;
            width: 14px;
            height: 48px;
            background: repeating-linear-gradient(
                45deg,
                #fff,
                #fff 6px,
                #e89ab1 6px,
                #e89ab1 12px
            );
            left: 83px;
            top: 5px;
            border-radius: 4px;
        }

        .flame {
            position: absolute;
            left: 84px;
            top: -28px;
            width: 13px;
            height: 25px;
            background: #ffcc4d;
            border-radius: 50% 50% 50% 50%;
            box-shadow: 0 0 18px #ff9d00;
            animation: flicker 0.8s infinite alternate;
        }

        @keyframes flicker {
            from {
                transform: scale(1) rotate(-3deg);
            }
            to {
                transform: scale(1.12) rotate(3deg);
            }
        }

        .button {
            border: none;
            padding: 15px 28px;
            border-radius: 30px;
            background: #ff8fb1;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(255, 143, 177, 0.25);
        }

        .button:hover {
            transform: translateY(-3px);
            background: #ff719d;
        }

        .hint {
            margin-top: 15px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #aa91a0;
        }

        .heart {
            position: fixed;
            color: rgba(255, 182, 207, 0.25);
            font-size: 20px;
            animation: float 8s infinite linear;
        }

        .heart:nth-child(1) {
            left: 10%;
            bottom: -30px;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 80%;
            bottom: -30px;
            animation-delay: 3s;
        }

        .heart:nth-child(3) {
            left: 45%;
            bottom: -30px;
            animation-delay: 5s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>

    <main class="screen">

        <div class="small-text">A little surprise for you</div>

        <h1>
            Happy Birthday,
            <span class="name">My Love</span> ❤️
        </h1>

        <p class="subtitle">
            Before you see what's waiting for you...
            make a wish. ✨
        </p>

        <div class="cake">
            <div class="flame" id="flame"></div>
            <div class="candle"></div>
            <div class="cake-top">
                <div class="icing"></div>
            </div>
        </div>

        <button class="button" onclick="blowCandle()">
            🕯️ Blow out the candle
        </button>

        <p class="hint">
            Make a wish first... ❤️
        </p>

    </main>

    <script>
        function blowCandle() {
            const flame = document.getElementById("flame");

            flame.style.transition = "0.5s";
            flame.style.opacity = "0";
            flame.style.transform = "scale(0)";

            setTimeout(() => {
                alert("Your wish has been made. ❤️");
            }, 600);
        }
    </script>

</body>
</html>
