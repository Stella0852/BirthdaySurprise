<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #ffe4ec,
          #fff5f8
        );

      font-family: Georgia, serif;
      color: #6b3045;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 8vw, 55px);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .photo {
      background: white;
      padding: 15px;

      border-radius: 20px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.18);
    }

    .photo img {
      width: 100%;
      max-height: 600px;

      object-fit: contain;

      border-radius: 15px;

      display: block;
    }

    .caption {
      font-size: 19px;
      margin-top: 20px;

      font-style: italic;
    }

    .heart {
      font-size: 28px;
      margin-top: 25px;
    }

  </style>
</head>

<body>

  <main class="container">

    <h1>
      Our Memories ❤️
    </h1>

    <div class="subtitle">
      Some of my favorite moments with you...
    </div>

    <div class="photo">

      <img
        src="photos/screenshot.png"
        alt="A special memory with Thomas ❤️"
      >

    </div>

    <div class="caption">
      One of my favorite memories with you ❤️
    </div>

    <div class="heart">
      ♡
    </div>

  </main>

</body>
</html>
