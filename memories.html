```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4ec, #fff5f8);
      font-family: Georgia, serif;
      color: #6b3045;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .slideshow {
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .slideshow img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 15px;
      display: block;
      margin: auto;
      transition: opacity 0.4s ease;
    }

    .caption {
      font-size: 18px;
      margin: 15px 5px 5px;
      font-style: italic;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      border: none;
      background: #d95b7d;
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #b94364;
    }

    .counter {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Our Memories ❤️</h1>

    <div class="subtitle">
      Some of my favorite moments with you...
    </div>

    <div class="slideshow">

      <img id="memoryImage" src="photos/photo1.jpg" alt="Our memory">

      <div class="caption" id="caption">
        One of my favorite memories with you ❤️
      </div>

    </div>

    <div class="buttons">
      <button onclick="previousPhoto()">← Previous</button>
      <button onclick="nextPhoto()">Next →</button>
    </div>

    <div class="counter" id="counter">
      1 / 3
    </div>

  </div>

  <script>

    const photos = [
      {
        image: "photos/photo1.jpg",
        caption: "One of my favorite memories with you ❤️"
      },
      {
        image: "photos/photo2.jpg",
        caption: "Another beautiful moment with you 💕"
      },
      {
        image: "photos/photo3.jpg",
        caption: "I love making memories with you 🥰"
      }
    ];

    let currentPhoto = 0;

    function showPhoto() {

      const image = document.getElementById("memoryImage");
      const caption = document.getElementById("caption");
      const counter = document.getElementById("counter");

      image.style.opacity = 0;

      setTimeout(() => {

        image.src = photos[currentPhoto].image;
        caption.textContent = photos[currentPhoto].caption;

        counter.textContent =
          (currentPhoto + 1) + " / " + photos.length;

        image.style.opacity = 1;

      }, 200);
    }

    function nextPhoto() {

      currentPhoto++;

      if (currentPhoto >= photos.length) {
        currentPhoto = 0;
      }

      showPhoto();
    }

    function previousPhoto() {

      currentPhoto--;

      if (currentPhoto < 0) {
        currentPhoto = photos.length - 1;
      }

      showPhoto();
    }

  </script>

</body>
</html>
