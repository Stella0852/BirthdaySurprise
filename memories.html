<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(circle at top, #fff0f5, transparent 45%),
        linear-gradient(135deg, #ffdce7, #fff7fa);

      font-family: Georgia, serif;
      color: #6b3045;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;

      transition: opacity 0.8s ease;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .intro {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: #b96b82;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(40px, 9vw, 60px);
      margin: 0 0 10px;
    }

    .subtitle {
      font-size: 17px;
      margin-bottom: 30px;
      color: #875265;
    }

    /* PHOTO */

    .photo-card {
      background: white;

      padding: 15px;

      border-radius: 18px;

      box-shadow:
        0 20px 50px rgba(100, 40, 60, 0.2);

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    .photo-card.fade {
      opacity: 0;
      transform: scale(0.97);
    }

    .photo-card img {
      width: 100%;

      max-height: 65vh;

      object-fit: contain;

      border-radius: 12px;

      display: block;
    }

    .caption {
      font-size: 19px;

      font-style: italic;

      margin:
        18px
        5px
        5px;

      color: #704054;
    }

    /* NEXT BUTTON */

    button {
      border: none;

      background: #d95b7d;

      color: white;

      padding: 14px 28px;

      border-radius: 30px;

      font-size: 15px;

      cursor: pointer;

      margin-top: 25px;

      box-shadow:
        0 8px 20px rgba(217,91,125,0.25);

      transition: 0.3s;
    }

    button:hover {
      background: #b94364;
      transform: translateY(-2px);
    }

    /* COUNTER */

    .counter {
      margin-top: 15px;

      font-size: 13px;

      color: #a27888;
    }

    .heart {
      font-size: 28px;
      margin-top: 20px;
      color: #d95b7d;
    }

  </style>
</head>

<body>

  <main class="container">

    <div class="intro">
      A little collection of us
    </div>

    <h1>
      Our Memories ❤️
    </h1>

    <div class="subtitle">
      Some moments I never want to forget...
    </div>


    <div
      class="photo-card"
      id="photoCard"
    >

      <img
        id="memoryPhoto"
        src="photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM.jpeg"
        alt="Our memory"
      >

      <div
        class="caption"
        id="caption"
      >
        A moment I'll always treasure ❤️
      </div>

    </div>


    <button onclick="nextMemory()">
      Next memory ❤️
    </button>


    <div
      class="counter"
      id="counter"
    >
      1 / 3
    </div>


    <div class="heart">
      ♡
    </div>

  </main>


  <script>

    const memories = [

      {
        image:
          "photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM.jpeg",

        caption:
          "A moment I'll always treasure ❤️"
      },

      {
        image:
          "photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM%20%281%29.jpeg",

        caption:
          "Another beautiful memory with you 💕"
      },

      {
        image:
          "photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM%20%282%29.jpeg",

        caption:
          "And another moment I want to keep forever 🥰"
      }

    ];


    let currentMemory = 0;


    function nextMemory() {

      const card =
        document.getElementById("photoCard");

      const image =
        document.getElementById("memoryPhoto");

      const caption =
        document.getElementById("caption");

      const counter =
        document.getElementById("counter");


      card.classList.add("fade");


      setTimeout(() => {

        currentMemory++;


        /*
         * After the final photo,
         * start again from the first.
         */

        if (
    currentMemory >= memories.length
) {

    window.location.href = "final.html";

    return;

}



        image.src =
          memories[currentMemory].image;

        caption.textContent =
          memories[currentMemory].caption;

        counter.textContent =
          (currentMemory + 1)
          + " / "
          + memories.length;


        card.classList.remove("fade");

      }, 500);

    }

  </script>

</body>
</html>
