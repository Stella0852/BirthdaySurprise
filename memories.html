<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #ffe4ec,
          #fff5f8
        );

      font-family: Georgia, serif;
      color: #6b3045;

      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(38px, 8vw, 60px);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .photo {
      background: white;
      padding: 12px;

      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.15);

      transition: transform 0.3s ease;
    }

    .photo:hover {
      transform: translateY(-5px) rotate(1deg);
    }

    .photo img {
      width: 100%;
      height: 350px;

      object-fit: cover;

      border-radius: 12px;

      display: block;
    }

    .caption {
      font-size: 17px;
      font-style: italic;
      margin: 15px 5px 8px;
    }

    .heart {
      font-size: 30px;
      margin-top: 40px;
    }

  </style>
</head>

<body>

  <main class="container">

    <h1>
      Our Memories ❤️
    </h1>

    <div class="subtitle">
      Some of my favorite moments with you...
    </div>


    <div class="gallery">


      <!-- PHOTO 1 -->

      <div class="photo">

        <img
          src="photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM.jpeg"
          alt="Our memory ❤️"
        >

        <div class="caption">
          A moment I'll always treasure ❤️
        </div>

      </div>


      <!-- PHOTO 2 -->

      <div class="photo">

        <img
          src="photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM%20%281%29.jpeg"
          alt="Our memory ❤️"
        >

        <div class="caption">
          Another beautiful memory 💕
        </div>

      </div>


      <!-- PHOTO 3 -->

      <div class="photo">

        <img
          src="photos/WhatsApp%20Image%202026-09-14%20at%2011.35.36%20AM%20%282%29.jpeg"
          alt="Our memory ❤️"
        >

        <div class="caption">
          More memories with you 🥰
        </div>

      </div>


    </div>


    <div class="heart">
      ♡
    </div>

  </main>

</body>
</html>
